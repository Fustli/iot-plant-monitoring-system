version: '3.8'

services:
  broker:
    image: eclipse-mosquitto
    container_name: iot_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    networks:
      - iot_net

  gateway:
    build: ./gateway
    container_name: iot_gateway
    depends_on:
      - broker
    environment:
      - MQTT_BROKER_HOST=broker
      - HUB_ID=123456
      - CLOUD_ENDPOINT=http://host.docker.internal:8000/telemetry
      - MQTT_TOPICS=home/sensors/+,telemetry
    # The gateway no longer exposes an HTTP server; MQTT only. Keep port mapping if you still
    # want to access MQTT or other services on the host.
    ports:
      - "8080:8080"
    secrets:
      - device_connection_string
    networks:
      - iot_net

  method_invoker:
    image: python:3.12-slim
    container_name: iot_method_invoker
    working_dir: /app
    volumes:
      - ./test:/app:ro
    command: ["sh","-c","pip install requests && python invoke_method.py"]
    secrets:
      - iothub_connection_string
      - device_id
    networks:
      - iot_net

networks:
  iot_net:

secrets:
  iothub_connection_string:
    file: ./secrets/iothub_connection_string
  device_connection_string:
    file: ./secrets/device_connection_string
  device_id:
    file: ./secrets/device_id