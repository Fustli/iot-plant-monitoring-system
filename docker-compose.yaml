# ==============================================================================
# IoT Plant Monitoring System - Docker Compose
# ==============================================================================
# 3-Tier Architecture: Frontend (Nginx) → Backend (FastAPI) → Database (PostgreSQL)
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d postgres     # Start only database
#   docker-compose up -d --build      # Rebuild and start
#   docker-compose logs -f            # View logs
#   docker-compose down               # Stop all services
# ==============================================================================

services:
  # ============================================================================
  # Tier 3: Database (PostgreSQL)
  # ============================================================================
  postgres:
    image: postgres:16
    container_name: iot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot_plant_db}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_plant_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iot-network

  # ============================================================================
  # Tier 2: Backend (FastAPI)
  # ============================================================================
  backend:
    build:
      context: ./ServerModule
      dockerfile: Dockerfile
    container_name: iot-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-iot_user}:${POSTGRES_PASSWORD:-iot_password}@postgres:5432/${POSTGRES_DB:-iot_plant_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-iot_plant_db}
      - POSTGRES_USER=${POSTGRES_USER:-iot_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-iot_password}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/admin/system/status", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - iot-network

  # ============================================================================
  # Tier 1: Frontend (Flutter Web + Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./flutter_app
      dockerfile: Dockerfile
    container_name: iot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - iot-network

# ==============================================================================
# Networks
# ==============================================================================
networks:
  iot-network:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres-data:

